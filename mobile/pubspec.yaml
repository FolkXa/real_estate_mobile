name: real_estate_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  google_sign_in: ^6.3.0

  # Image handling
  image_picker: ^1.0.7
  image: ^4.1.3
  cached_network_image: ^3.3.0
  mime: ^1.0.4
  path: ^1.9.1

  # UI packages
  flutter_slidable: ^4.0.0
  shimmer: ^3.0.0
  country_code_picker: ^3.2.0

  # Utility
  intl: ^0.19.0
  http: ^0.13.6
  flutter_dotenv: ^5.1.0

  #camera
  camera: ^0.11.1
  path_provider: ^2.1.5



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/data/thai_provinces.json
    - assets/data/thai_amphures.json
    - assets/data/thai_tambons.json
    - .env

