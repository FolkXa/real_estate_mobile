  firebase_storage: ^12.4.4
  permission_handler: ^11.4.0
  panorama: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

